services:
  gymdl:
    platform: linux/amd64
    image: gymdl:latest 
    build:
      context: .
    container_name: gymdl
    environment:
      - PUID=1000
      - PGID=1000
      # Allows Settings to request a graceful container restart; keep restart policy enabled below.
      - GYMDL_WEBUI_RESTART_ENABLED=true
    volumes:
      #必须挂载配置文件否则项目无法启动
      - ./config.yaml:/app/config.yaml
      # 持久化全部运行数据（SQLite、历史、下载目录、日志、临时文件等）
      - ./data:/app/data
      # 缓存目录
      - ./data/.pipcache:/root/.cache/pip
    expose:
      #api端口
      - 8080
      # webhook端口
      - 9000
    network_mode: host
    restart: always
