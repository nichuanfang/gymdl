name: Telegram preview candidate image

on:
  push:
    branches:
      - codex/music-preview-fix-v1.5.72
    paths:
      - "**"

permissions:
  contents: read
  packages: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push temporary candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:telegram-preview-${{ github.sha }}
