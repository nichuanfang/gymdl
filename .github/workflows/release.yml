name: Build&Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version
        run: |
          VERSION="${GITHUB_REF_NAME:-latest}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build and Push Docker image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}
          if [ "${VERSION}" = "latest" ]; then
            echo "Building image: $IMAGE_NAME:latest"
            docker build -t $IMAGE_NAME:latest .
            echo "Pushing latest image..."
            docker push $IMAGE_NAME:latest
          else
            echo "Building image: $IMAGE_NAME:${VERSION} and latest"
            docker build -t $IMAGE_NAME:${VERSION} -t $IMAGE_NAME:latest .
            echo "Pushing versioned and latest images..."
            docker push $IMAGE_NAME:${VERSION}
            docker push $IMAGE_NAME:latest
          fi
  
  build:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Build release artifacts
        run: make release

      - name: Generate Release Notes
        id: generate_changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          # 输出变量为 steps.generate_changelog.outputs.changes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.generate_changelog.outputs.changes }}
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}